  android: true
  ios: true
  image_path: "assets/images/logo/app_logo.png"

dependency_overrides:
  intl: 0.19.0


flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_bold.ttf
        - asset: assets/fonts/inter_medium.ttf
        - asset: assets/fonts/inter_regular.ttf
        - asset: assets/fonts/inter_semi_bold.ttf
  uses-material-design: true

  assets:
    - assets/localization/
    - assets/images/
    - assets/images/app_bar/
    - assets/images/bottom_bar/
    - assets/images/component/
    - assets/images/logo/
    - assets/song/progress_audio.mp3
    - assets/models/labelmap.txt
    - assets/ml/object_labeler.tflite
flutter_gen:
  output: lib/core/gen/assets/
  integrations:
    flutter_svg: true
